# A private, hand-appended notebook — never read by the public site build,
# only by tools/serve's password-gated /private route. See docs/decisions.md.
#
# One entry per item. `date` is free text (a full timestamp or just a day);
# entries render newest first by string order, so ISO-ish values
# ("2026-08-08" or "2026-08-08T09:15") sort correctly without extra code.
# `joy` marks an entry for the "Joys" filter. `photo` is optional — a
# filename that must exist in private/photos/.
