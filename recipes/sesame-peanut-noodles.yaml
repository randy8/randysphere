title: Sesame-Peanut Noodles
description: 'Wheat noodles in a sesame-peanut sauce with crisp tofu and shiitake.'
prepTime: 10 min
cookTime: 10 min
totalTime: 20 min
servings: '2'
difficulty: Easy
ingredients:
  - '**250 g** wheat noodles'
  - '**200 g** extra-firm tofu, crumbled'
  - '**150 g** shiitake mushrooms, chopped'
  - '**35 g** Chinese sesame paste'
  - '**30 g** creamy peanut butter'
  - '**25 g** soy sauce'
  - '**20 g** black vinegar'
  - '**5 g** toasted sesame oil'
  - '**2 tsp** sugar'
  - '**2** cloves garlic, grated'
  - '**1 tsp** grated ginger'
  - '**1 tbsp** chili crisp'
  - '**60–90 g** hot water'
optionalIngredients:
  - 'Cucumber, julienned'
  - 'Scallions'
  - 'Crushed peanuts'
  - 'Extra chili crisp'
instructions:
  - 'Whisk the sesame paste, peanut butter, soy sauce, vinegar, sesame oil, sugar, garlic, ginger, and chili crisp, adding the hot water gradually until smooth.'
  - 'Pan-fry the tofu and mushrooms in a little oil until browned, **8–10 minutes**. Season with a splash of soy sauce.'
  - 'Boil the noodles according to the package, reserving some cooking water.'
  - 'Toss the noodles with the sauce, adding cooking water until silky.'
  - 'Top with the tofu and mushrooms, and any toppings.'
brands:
  - 'Wheat noodles: A-Sha'
  - 'Extra-firm tofu: Nasoya'
  - 'Chinese sesame paste: Wang Zhihe'
  - 'Peanut butter: Jif'
  - 'Soy sauce: Kikkoman'
  - 'Black vinegar: Gold Plum'
  - 'Toasted sesame oil: Kadoya'
  - 'Chili crisp: Lao Gan Ma'
