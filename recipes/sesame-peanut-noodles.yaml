title: Sesame-Peanut Noodles
description: 'Wheat noodles in a sesame-peanut sauce, topped with crisp tofu and shiitake.'
totalTime: 20 min
servings: '2'
difficulty: Easy
ingredients:
  - '**250 g** wheat noodles (A-Sha)'
  - '**200 g** extra-firm tofu (Nasoya), crumbled'
  - '**150 g** shiitake mushrooms, chopped'
  - '**½** cucumber, julienned'
  - '**2** scallions, sliced'
  - '**2 tbsp** crushed peanuts'
  - '**35 g** Chinese sesame paste (Wang Zhihe), for the sauce'
  - '**30 g** creamy peanut butter (Jif), for the sauce'
  - '**25 mL** soy sauce (Kikkoman), for the sauce'
  - '**20 mL** black vinegar (Gold Plum), for the sauce'
  - '**5 mL** toasted sesame oil (Kadoya), for the sauce'
  - '**2 tsp** sugar, for the sauce'
  - '**2** garlic cloves, grated, for the sauce'
  - '**1 tsp** grated ginger, for the sauce'
  - '**1 tbsp** chili crisp (Lao Gan Ma), plus extra to serve'
  - '**60–90 mL** hot water, for the sauce'
instructions:
  - 'Whisk all the sauce ingredients together until smooth, adding the hot water gradually.'
  - 'Pan-fry the mushrooms and crumbled tofu in a little oil until browned, about **8–10 minutes**. Season with a splash of soy sauce.'
  - 'Boil the noodles according to the package instructions. Drain, reserving some of the cooking water.'
  - 'Toss the noodles with the sauce, adding cooking water until silky.'
  - 'Top with the tofu and mushrooms, cucumber, scallions, crushed peanuts, and extra chili crisp.'
