title: Teriyaki Tofu
description: 'Really take your time with that tofu. Be gentle.'
prepTime: 10 min
cookTime: 25 min
totalTime: 35 min
servings: '3–4'
difficulty: Easy
ingredients:
  - '**1** block extra-firm tofu (~**400–450 g**), cubed or sliced'
  - 'Avocado oil or extra virgin olive oil'
  - '**5–7** cloves garlic (~**20–35 g**), finely chopped'
  - '**1** Taylor Farms Teriyaki Stir Fry Kit (or similar vegetables)'
optionalIngredients:
  - 'Sesame seeds'
  - 'Japanese BBQ sauce'
instructions:
  - 'Heat a thin layer of oil over medium heat and add the tofu.'
  - "Flip or stir every ~**5 minutes** for **15–20 minutes**, until golden and as dry as you'd like."
  - 'Transfer the tofu to a plate.'
  - 'Add a little more oil and cook the vegetables, stirring regularly.'
  - 'After about **5 minutes**, add the garlic and cook until fragrant.'
  - 'Return the tofu to the pan and drizzle in the teriyaki sauce packet.'
  - 'Reduce the heat to medium-low or low and cook a few minutes longer to dry the tofu further.'
  - 'Finish with sesame seeds and Japanese BBQ sauce, if using.'
notes:
  - 'Patting the tofu dry beforehand helps it brown.'
  - 'The longer the final cook, the chewier the tofu becomes.'
