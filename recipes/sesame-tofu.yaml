title: Sesame Tofu
description: 'Crispy air-fried tofu in a sesame-soy glaze.'
prepTime: 15 min
cookTime: 20 min
totalTime: 35 min
servings: '2–3'
difficulty: Easy
ingredients:
  - '**1** block extra-firm tofu'
  - '**2 tbsp** cornstarch, for the tofu'
  - '**1 tbsp** oil'
  - "**3 tbsp** Bachan's Original Japanese Barbecue Sauce"
  - '**1 tbsp** rice vinegar'
  - '**1 tsp** roasted sesame oil'
  - '**1 tbsp** water'
  - '**½ tsp** cornstarch, for the sauce'
  - '**½ tsp** garlic powder'
  - '**¼ tsp** ground ginger'
  - 'Red pepper flakes, to taste'
optionalIngredients:
  - 'Toasted sesame seeds'
  - 'Scallions'
instructions:
  - 'Dry the tofu well and cut into cubes.'
  - 'Toss with the cornstarch and oil.'
  - 'Air fry until crisp and golden, tossing halfway through.'
  - 'Whisk the sauce ingredients together while cold.'
  - 'Simmer the sauce for **1–2 minutes**, until glossy and slightly thickened.'
  - 'Toss the crispy tofu in the sauce until evenly glazed.'
  - 'Finish with toasted sesame seeds and scallions.'
notes:
  - "Keep the cornstarch coating light and don't oversauce it — the tofu should stay crisp."
