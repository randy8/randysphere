title: Air-Fried Balsamic Parmesan Brussels Sprouts
description: 'Crispy air-fried Brussels sprouts glazed with balsamic and Parmesan.'
cookTime: 15 min
totalTime: 15 min
servings: '2–3'
difficulty: Easy
ingredients:
  - '**1 lb** Brussels sprouts, halved'
  - '**1 tbsp** olive oil'
  - '**1 tbsp** balsamic vinegar'
  - '**½ tsp** garlic powder'
  - '**½ tsp** salt'
  - 'Black pepper'
  - '**¼ cup** grated Parmesan'
instructions:
  - 'Toss Brussels sprouts with olive oil, balsamic vinegar, garlic powder, salt, and pepper.'
  - 'Air fry at **375°F** for **12–15 minutes**, shaking halfway through.'
  - 'Add Parmesan for the last **2–3 minutes**.'
  - 'Finish with a little extra balsamic and Parmesan.'
