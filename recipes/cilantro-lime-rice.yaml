title: Cilantro Lime Rice
description: 'Chipotle.'
prepTime: 5 min
cookTime: 25 min
totalTime: 30 min
servings: '4–6'
difficulty: Easy
ingredients:
  - '**300 g** long-grain white rice (dry)'
  - '**20–30 g** cilantro, finely chopped'
  - 'Juice of **1** lime (~**30 g**)'
  - '**15 g** butter'
  - '**2 g** salt (or to taste)'
instructions:
  - 'Wash the rice and fill the rice cooker to the **2** line (slightly under is fine).'
  - 'Add a splash of oil and stir.'
  - 'Once the rice cooker finishes, let the rice rest covered for **5–10 minutes**, then uncovered for another **5–10 minutes**.'
  - 'Fluff with a fork and transfer to a large bowl.'
  - 'Add the butter, lime juice, cilantro, and salt.'
  - 'Stir gently until everything is evenly incorporated.'
notes:
  - 'Add the butter while the rice is still hot so it melts evenly.'
  - 'Excellent for burrito bowls, tacos, or alongside grilled tofu.'
