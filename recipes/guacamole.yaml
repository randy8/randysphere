title: Guacamole
description: 'Hass avocado, red onion, jalapeño, lime, and cilantro.'
prepTime: 15 min
totalTime: 15 min
servings: '4–6'
difficulty: Easy
ingredients:
  - '**3** large Hass avocados (~**500–550 g** flesh)'
  - '**1** medium red onion (~**85 g**), diced'
  - '**1–2** jalapeños (~**25 g**), diced (leave more seeds for extra heat)'
  - '**15 g** cilantro, chopped'
  - 'Juice of **1** lime (~**30 g**)'
  - '**5 g** salt'
instructions:
  - 'Mash the avocado with the salt.'
  - 'In a separate bowl, combine the lime juice, onion, jalapeño, and cilantro. Let sit for a few minutes to soften the onion.'
  - 'Gently fold everything together, keeping the guacamole chunky.'
notes:
  - 'Taste before serving and adjust salt or lime as needed.'
  - 'Best eaten the same day.'
