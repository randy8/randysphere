title: Pesto Penne
description: 'Penne tossed with basil pesto and Parmesan.'
prepTime: 5 min
cookTime: 12 min
totalTime: 17 min
servings: '3–4'
difficulty: Easy
ingredients:
  - "**454 g** Rao's penne"
  - '**120 g** Seggiano pesto'
  - '**30 g** grated Parmesan'
instructions:
  - 'Boil the pasta until **1 minute** before al dente.'
  - 'Reserve at least **100 g** pasta water.'
  - 'Whisk **120 g** pesto (strain off a bit of the oil if desired) with **60 g** pasta water until emulsified.'
  - 'Add the pasta to the pot with the pesto mixture and stir until evenly coated.'
  - 'Add the grated Parmesan and toss until incorporated.'
notes:
  - 'Reserve extra pasta water in case the sauce needs loosening.'
  - 'Best served immediately.'
